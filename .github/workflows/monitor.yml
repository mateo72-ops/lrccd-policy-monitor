name: LRCCD Policy Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run policy monitor
        run: python monitor.py

      - name: Show results
        run: |
          echo "Policy inventory created:"
          ls -la
          echo "Number of records:"
          python -c "import json; print(len(json.load(open('policy_index.json'))))"

      - name: Upload policy inventory
        uses: actions/upload-artifact@v4
        with:
          name: lrccd-policy-inventory
          path: policy_index.json
