name: LRCCD Policy Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run policy monitor
        run: python monitor.py

      - name: Show results
        run: |
          echo "Monitor completed."
          python -c "import json; d=json.load(open('policy_state.json')); print('Documents tracked:', len(d))"
          python -c "import json; d=json.load(open('changes.json')); print('Changes detected:', len(d))"

      - name: Save monitoring state
        run: |
          git config user.name "LRCCD Policy Monitor"
          git config user.email "actions@github.com"
          git add policy_state.json changes.json
          if git diff --cached --quiet; then
            echo "No monitoring state changes to save."
          else
            git commit -m "Update policy monitoring state"
            git push
          fi

      - name: Upload monitoring results
        uses: actions/upload-artifact@v4
        with:
          name: lrccd-policy-monitor-results
          path: |
            policy_state.json
            changes.json
